  <rect x="48" y="48" width="704" height="404" rx="24" fill="url(#g)"/>

  <text x="400" y="200" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="52" font-weight="800" text-anchor="middle">코모</text>
