<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="390" height="700" fill="#0d0d0d"/>

  <!-- Header -->
  <text x="195" y="38" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">스픽독 (Speakdog)</text>
  <text x="195" y="56" fill="#475569" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">시각장애인 PDF 리더 · TTS 음성 지원</text>

  <!-- MOBILE -->
  <text x="195" y="84" fill="#334155" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">MOBILE</text>

  <!-- React Native iOS -->
  <rect x="30" y="92" width="152" height="90" rx="10" fill="#0d1f2d" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="106" y="116" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">React Native</text>
  <text x="106" y="132" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">iOS App</text>
  <rect x="46" y="142" width="120" height="28" rx="6" fill="#091828" stroke="#06b6d4" stroke-width="1"/>
  <text x="106" y="160" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">PDF Viewer · TTS</text>

  <!-- React Native Android -->
  <rect x="208" y="92" width="152" height="90" rx="10" fill="#0d1f2d" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="284" y="116" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">React Native</text>
  <text x="284" y="132" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">Android App</text>
  <rect x="224" y="142" width="120" height="28" rx="6" fill="#091828" stroke="#06b6d4" stroke-width="1"/>
  <text x="284" y="160" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">PDF Viewer · TTS</text>

  <!-- TTS Engine -->
  <rect x="30" y="196" width="330" height="44" rx="10" fill="#110d28" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="195" y="216" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">TTS Engine (Text-to-Speech)</text>
  <text x="195" y="232" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">음성 합성 · 접근성 · 시각장애인 지원</text>

  <!-- Arrows -->
  <line x1="106" y1="182" x2="106" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="284" y1="182" x2="284" y2="196" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="195" y1="240" x2="195" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- AWS CLOUD -->
  <text x="195" y="260" fill="#334155" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">AWS CLOUD</text>

  <rect x="30" y="272" width="330" height="148" rx="10" fill="#0a1020" stroke="#f97316" stroke-width="1.5"/>
  <text x="195" y="294" fill="#fb923c" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Amazon Web Services</text>

  <!-- S3 -->
  <rect x="44" y="304" width="90" height="54" rx="8" fill="#1a0f00" stroke="#f97316" stroke-width="1"/>
  <text x="89" y="326" fill="#fb923c" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">S3</text>
  <text x="89" y="342" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">PDF 파일</text>
  <text x="89" y="354" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">저장소</text>

  <!-- Lambda -->
  <rect x="150" y="304" width="90" height="54" rx="8" fill="#1a0f00" stroke="#f97316" stroke-width="1"/>
  <text x="195" y="326" fill="#fb923c" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Lambda</text>
  <text x="195" y="342" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">PDF 파싱</text>
  <text x="195" y="354" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">텍스트 추출</text>

  <!-- API Gateway -->
  <rect x="256" y="304" width="90" height="54" rx="8" fill="#1a0f00" stroke="#f97316" stroke-width="1"/>
  <text x="301" y="322" fill="#fb923c" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">API</text>
  <text x="301" y="338" fill="#fb923c" font-family="system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Gateway</text>
  <text x="301" y="354" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">REST API</text>

  <!-- S3 → Lambda → API -->
  <line x1="134" y1="331" x2="150" y2="331" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="240" y1="331" x2="256" y2="331" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Arrow to React Web -->
  <line x1="195" y1="420" x2="195" y2="450" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WEB -->
  <text x="195" y="442" fill="#334155" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">WEB</text>

  <!-- React Web -->
  <rect x="80" y="454" width="230" height="62" rx="10" fill="#0d1f2d" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="195" y="478" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">React Web</text>
  <text x="195" y="496" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">웹 뷰어 · 어드민 · PDF 업로드</text>

  <!-- Tech chips -->
  <rect x="30" y="550" width="80" height="24" rx="12" fill="#0d1f2d" stroke="#06b6d4" stroke-width="1"/>
  <text x="70" y="566" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">React Native</text>

  <rect x="118" y="550" width="56" height="24" rx="12" fill="#0d1f2d" stroke="#3b82f6" stroke-width="1"/>
  <text x="146" y="566" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">React</text>

  <rect x="182" y="550" width="44" height="24" rx="12" fill="#1a0f00" stroke="#f97316" stroke-width="1"/>
  <text x="204" y="566" fill="#fb923c" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">AWS</text>

  <rect x="234" y="550" width="56" height="24" rx="12" fill="#110d28" stroke="#8b5cf6" stroke-width="1"/>
  <text x="262" y="566" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">TTS</text>

  <rect x="298" y="550" width="62" height="24" rx="12" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <text x="329" y="566" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">TypeScript</text>

  <!-- Demo video hint -->
  <rect x="80" y="610" width="230" height="36" rx="10" fill="#1a0a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="195" y="630" fill="#f87171" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">▶  시연 영상 보기 (YouTube)</text>

  <text x="195" y="672" fill="#1e293b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">접근성 · Accessibility · 사회 혁신</text>
</svg>
