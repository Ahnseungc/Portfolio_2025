  <rect x="50" y="534" width="290" height="64" rx="12" fill="#0a1f10" stroke="#4ade80" stroke-width="2"/>
  <text x="195" y="556" fill="#4ade80" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">서울시 교육청</text>
  <text x="195" y="574" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" text-anchor="middle">실제 MVP 도입 · 운영</text>
  <text x="195" y="590" fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">직장인 취미 플랫폼 · 운영 검증</text>

  <!-- Tech chips -->
  <rect x="30" y="630" width="68" height="24" rx="12" fill="#0f0f0f" stroke="#f1f5f9" stroke-width="1"/>
  <text x="64" y="646" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Next.js 14</text>

  <rect x="106" y="630" width="56" height="24" rx="12" fill="#0d1a2e" stroke="#3b82f6" stroke-width="1"/>
  <text x="134" y="646" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Flutter</text>

  <rect x="170" y="630" width="62" height="24" rx="12" fill="#0a0a0a" stroke="#e2e8f0" stroke-width="1"/>
  <text x="201" y="646" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Vercel</text>

  <rect x="240" y="630" width="56" height="24" rx="12" fill="#1a1030" stroke="#8b5cf6" stroke-width="1"/>
  <text x="268" y="646" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">WebView</text>

  <rect x="304" y="630" width="56" height="24" rx="12" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <text x="332" y="646" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">TypeScript</text>
</svg>
