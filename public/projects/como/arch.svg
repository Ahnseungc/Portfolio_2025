<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="390" height="700" fill="#0d0d0d"/>

  <!-- Header -->
  <text x="195" y="38" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">코모 (Como)</text>
  <text x="195" y="56" fill="#475569" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">직장인 취미 플랫폼 · 서울시 교육청 MVP 도입</text>

  <!-- MOBILE LAYER -->
  <text x="195" y="86" fill="#334155" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="2">MOBILE</text>

  <!-- Flutter iOS -->
  <rect x="30" y="96" width="152" height="80" rx="10" fill="#0d1a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="106" y="122" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Flutter</text>
  <text x="106" y="140" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">iOS App</text>
  <text x="106" y="157" fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">WebView Bridge</text>

  <!-- Flutter Android -->
  <rect x="208" y="96" width="152" height="80" rx="10" fill="#0d1a2e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="284" y="122" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="middle">Flutter</text>
  <text x="284" y="140" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">Android App</text>
  <text x="284" y="157" fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">WebView Bridge</text>

  <!-- Arrows from Flutter to WebView -->
  <line x1="106" y1="176" x2="106" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="284" y1="176" x2="284" y2="220" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="106" y1="220" x2="284" y2="220" stroke="#334155" stroke-width="1.5"/>
  <line x1="195" y1="220" x2="195" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WebView layer -->
  <rect x="120" y="244" width="150" height="38" rx="8" fill="#1a1030" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="195" y="268" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle">WebView Layer</text>

  <!-- Arrow -->
  <line x1="195" y1="282" x2="195" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

