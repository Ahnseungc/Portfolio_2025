<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 700">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L7,3.5 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="390" height="700" fill="#0d0d0d"/>

  <!-- Header -->
  <text x="195" y="38" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="17" font-weight="700" text-anchor="middle">WebViewKit</text>
  <text x="195" y="56" fill="#475569" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">pnpm monorepo · npm package · MIT</text>

  <!-- pnpm workspace dashed border -->
  <rect x="18" y="68" width="354" height="354" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <rect x="28" y="64" width="80" height="16" rx="4" fill="#0d0d0d"/>
  <text x="68" y="75" fill="#334155" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">pnpm workspace</text>

  <!-- packages/core -->
  <rect x="30" y="82" width="158" height="250" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="109" y="102" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">packages/core</text>
  <text x="109" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">@ahnseungchan/webviewkit</text>

  <!-- Stack Router -->
  <rect x="44" y="126" width="130" height="44" rx="7" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <text x="109" y="144" fill="#93c5fd" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Stack Router</text>
  <text x="109" y="159" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">push · pop · back · depth</text>

  <!-- WebView Bridge -->
  <rect x="44" y="178" width="130" height="44" rx="7" fill="#1a1030" stroke="#8b5cf6" stroke-width="1"/>
  <text x="109" y="196" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">WebView Bridge</text>
  <text x="109" y="211" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">RN · Flutter postMessage</text>

  <!-- History API -->
  <rect x="44" y="230" width="130" height="44" rx="7" fill="#0d1f2d" stroke="#06b6d4" stroke-width="1"/>
  <text x="109" y="248" fill="#67e8f9" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">History API</text>
  <text x="109" y="263" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">browser history sync</text>

  <!-- src/type.ts -->
  <rect x="44" y="282" width="130" height="36" rx="7" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="109" y="304" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">type.ts · constants.ts</text>

  <!-- packages/browser -->
  <rect x="202" y="82" width="158" height="172" rx="10" fill="#0f1a12" stroke="#4ade80" stroke-width="1.5"/>
  <text x="281" y="102" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">packages/browser</text>
  <text x="281" y="116" fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Demo App</text>

  <!-- Vite + React -->
  <rect x="216" y="126" width="130" height="44" rx="7" fill="#0f1f12" stroke="#4ade80" stroke-width="1"/>
  <text x="281" y="144" fill="#86efac" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Vite + React</text>
  <text x="281" y="159" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">실시간 동작 확인</text>

  <!-- vite.config.ts -->
  <rect x="216" y="178" width="130" height="36" rx="7" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="281" y="200" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">vite.config.ts · tsup bundle</text>

  <!-- dist output badge -->
  <rect x="216" y="222" width="130" height="28" rx="7" fill="#1a1a0f" stroke="#ca8a04" stroke-width="1"/>
  <text x="281" y="240" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">dist/ (tsc build output)</text>

  <!-- Connector: core bottom + browser bottom → down -->
  <line x1="109" y1="332" x2="109" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="281" y1="268" x2="281" y2="386" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="109" y1="386" x2="281" y2="386" stroke="#334155" stroke-width="1.5"/>
  <line x1="195" y1="386" x2="195" y2="412" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Jest Tests -->
  <rect x="105" y="412" width="180" height="52" rx="10" fill="#1a150a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="195" y="433" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">Jest Tests</text>
  <text x="195" y="450" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">stack · bridge · edge cases</text>

  <!-- Arrow to npm -->
  <line x1="195" y1="464" x2="195" y2="494" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- npm publish -->
  <rect x="72" y="494" width="246" height="62" rx="12" fill="#150a0a" stroke="#ef4444" stroke-width="2"/>
  <text x="195" y="518" fill="#f87171" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">npm publish</text>
  <text x="195" y="536" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10" text-anchor="middle">@ahnseungchan/webviewkit</text>
  <text x="195" y="550" fill="#475569" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">--access public · v1.3.0</text>

  <!-- Tech chips -->
  <rect x="30" y="590" width="80" height="24" rx="12" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <text x="70" y="606" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">TypeScript</text>

  <rect x="118" y="590" width="56" height="24" rx="12" fill="#0d1f2d" stroke="#06b6d4" stroke-width="1"/>
  <text x="146" y="606" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">React</text>

  <rect x="182" y="590" width="50" height="24" rx="12" fill="#1a0a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="207" y="606" fill="#f87171" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">npm</text>

  <rect x="240" y="590" width="50" height="24" rx="12" fill="#1a150a" stroke="#f59e0b" stroke-width="1"/>
  <text x="265" y="606" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Jest</text>

  <rect x="298" y="590" width="62" height="24" rx="12" fill="#0f1a12" stroke="#4ade80" stroke-width="1"/>
  <text x="329" y="606" fill="#86efac" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">Vite · pnpm</text>

  <!-- Version label -->
  <text x="195" y="648" fill="#1e293b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">MIT License · Open Source</text>
</svg>
