  <text x="195" y="370" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">취미 매칭</text>
  <text x="195" y="385" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">피드 · 검색</text>
  <text x="195" y="397" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">커뮤니티</text>

  <!-- TypeScript -->
  <rect x="254" y="350" width="90" height="50" rx="7" fill="#0f1f3d" stroke="#3b82f6" stroke-width="1"/>
  <text x="299" y="370" fill="#60a5fa" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">TypeScript</text>
  <text x="299" y="385" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">Tailwind CSS</text>
  <text x="299" y="397" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">React Query</text>

  <!-- Arrow to Vercel -->
  <line x1="195" y1="414" x2="195" y2="444" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vercel -->
  <rect x="80" y="444" width="230" height="58" rx="10" fill="#0a0a0a" stroke="#f1f5f9" stroke-width="1.5"/>
  <text x="195" y="468" fill="#f1f5f9" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle">Vercel</text>
  <text x="195" y="485" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Edge Deploy · CDN · CI/CD</text>
  <text x="195" y="498" fill="#334155" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">자동 배포 · Preview</text>

  <!-- Arrow to deployment badge -->
  <line x1="195" y1="502" x2="195" y2="534" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

