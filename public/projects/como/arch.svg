  <text x="91" y="370" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9" font-weight="600" text-anchor="middle">App Router</text>
  <text x="91" y="385" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">SSR · ISR</text>
  <text x="91" y="397" fill="#475569" font-family="system-ui,sans-serif" font-size="8" text-anchor="middle">API Routes</text>

